<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none';" />
  <title>团建内容工作台</title>
  <link rel="stylesheet" href="./shell.css" />
</head>
<body>
  <main class="desktop-shell is-gpt-visible" id="desktopShell">
    <section class="workspace-pane">
      <webview id="workspaceView" src="http://127.0.0.1:4327/" partition="persist:workspace"></webview>
    </section>
    <section class="gpt-pane" id="gptPane">
      <header>
        <div><strong>ChatGPT</strong><span id="gptStatus">真实网页 · 登录状态保存在本机</span></div>
        <label>登录空间
          <select id="gptProfile">
            <option value="1">账号 1</option>
            <option value="2">账号 2</option>
            <option value="3">账号 3</option>
          </select>
        </label>
        <button id="reloadGpt" type="button">刷新</button>
      </header>
      <div class="gpt-webviews" id="gptWebviews"></div>
    </section>
  </main>
  <script src="./shell.js"></script>
</body>
</html>
